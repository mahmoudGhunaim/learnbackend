<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>LearnBackend · ASP.NET Core</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237c5cff'/><text x='16' y='22' font-size='15' font-family='monospace' font-weight='700' fill='white' text-anchor='middle'>C%23</text></svg>" />
    <script>
      // Apply the saved theme and language before React loads (no flash of the wrong theme).
      try {
        var theme = localStorage.getItem('lb-theme') || 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        var lang = localStorage.getItem('lb-lang') || 'ar';
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
